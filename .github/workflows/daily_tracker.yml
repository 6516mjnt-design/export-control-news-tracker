name: Export Control News Daily Tracker

on:
  schedule:
    - cron: '0 22 * * *'  # 毎日 UTC 22:00（日本時間 朝7:00）
  workflow_dispatch:

jobs:
  track:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser pandas
      - name: Run collector script
        run: python script.py
      - name: Commit and push CSV
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add export_control_news.csv
          git commit -m "Update export control news CSV [skip ci]" || exit 0
          git push
