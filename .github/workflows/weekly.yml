name: Export Control Weekly Raw Generator

on:
  schedule:
    - cron: '30 23 * * 0'  # 毎週日曜 UTC 23:30（日本時間 月曜 朝8:30）
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas
      - name: Run raw extraction script
        run: python generate_weekly_html.py
      - name: Commit and push weekly text
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add weekly_news_raw.txt
          git commit -m "Update weekly_news_raw.txt for export control [skip ci]" || exit 0
          git push